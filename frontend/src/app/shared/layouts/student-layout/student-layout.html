<div
  class="student-shell bg-surface font-body-md text-body-md text-on-surface antialiased"
  dir="rtl"
>
  <header
    class="sticky top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] border-b border-outline-variant/30"
  >
    <div
      class="h-16 max-w-7xl mx-auto px-margin-mobile lg:px-margin flex items-center justify-between"
    >
      <div class="flex items-center gap-space-md">
        <a
          routerLink="/student/dashboard"
          class="flex items-center gap-space-xs no-underline text-inherit"
          aria-label="شادوينج — المسار التعليمي"
        >
          <div
            class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center text-on-primary shadow-[0_3px_0_0_#005049]"
          >
            <span class="material-symbols-outlined text-[20px]">graphic_eq</span>
          </div>
          <div class="flex flex-col leading-none">
            <span
              class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-extrabold"
              >شادوينج</span
            >
            <span class="font-label-sm text-label-sm text-primary font-bold">Shadowing</span>
          </div>
        </a>

        <div class="h-5 w-px bg-outline-variant/40 hidden sm:block"></div>

        <nav class="hidden md:flex items-center gap-space-sm" aria-label="التنقل الرئيسي">
          <a
            routerLink="/student/dashboard"
            routerLinkActive="bg-primary-container text-on-primary-container font-bold"
            [routerLinkActiveOptions]="{exact: true}"
            class="px-space-sm py-space-xs rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high font-label-lg text-label-lg transition-colors no-underline"
          >
            المسار التعليمي
          </a>
          <a
            routerLink="/student/recordings"
            routerLinkActive="bg-primary-container text-on-primary-container font-bold"
            class="px-space-sm py-space-xs rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high font-label-lg text-label-lg transition-colors no-underline"
          >
            تسجيلاتي
          </a>
          <a
            routerLink="/student/knowledge-bank"
            routerLinkActive="bg-primary-container text-on-primary-container font-bold"
            class="px-space-sm py-space-xs rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high font-label-lg text-label-lg transition-colors no-underline"
          >
            بنك الكلمات
          </a>
          <a
            routerLink="/student/progress"
            routerLinkActive="bg-primary-container text-on-primary-container font-bold"
            class="px-space-sm py-space-xs rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high font-label-lg text-label-lg transition-colors no-underline"
          >
            تقدمي
          </a>
        </nav>
      </div>

      <div class="flex items-center gap-space-md">
        <a
          routerLink="/student/progress"
          class="flex items-center gap-space-xs px-space-sm py-1 rounded-full bg-primary-fixed/40 text-on-primary-fixed border-0 no-underline"
          aria-label="عرض تقدم المستوى"
        >
          <span class="material-symbols-outlined text-[16px] text-primary">verified</span>
          <span class="font-label-md text-label-md font-bold">تقدمي</span>
        </a>

        <div class="relative student-account">
          <button
            type="button"
            class="w-9 h-9 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm cursor-pointer border-0"
            (click)="toggleAccount()"
            [attr.aria-expanded]="accountOpen"
            aria-label="فتح قائمة الحساب"
          >
            <span class="material-symbols-outlined text-[18px]">person</span>
          </button>
          @if (accountOpen) {
          <div
            class="student-account__menu absolute left-0 top-full mt-2 w-48 p-2 rounded-2xl bg-surface-container-lowest border border-outline-variant/40 shadow-xl z-50"
          >
            <div
              class="px-3 py-2 border-b border-surface-container-high text-xs font-bold text-on-surface-variant"
            >
              حساب الطالب
            </div>
            <a
              routerLink="/student/progress"
              (click)="accountOpen = false"
              class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-bold text-on-surface hover:bg-surface-container-high no-underline transition-colors"
            >
              <span class="material-symbols-outlined text-[18px]">account_circle</span>
              تقدمي
            </a>
            <a
              routerLink="/student/messages"
              (click)="accountOpen = false"
              class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-bold text-on-surface hover:bg-surface-container-high no-underline transition-colors"
            >
              <span class="material-symbols-outlined text-[18px]">description</span>
              الرسائل
            </a>
            <a
              routerLink="/logout"
              (click)="accountOpen = false"
              class="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-bold text-error hover:bg-error-container/40 border-0 bg-transparent cursor-pointer transition-colors"
            >
              <span class="material-symbols-outlined text-[18px]">logout</span>
              تسجيل الخروج
            </a>
          </div>
          }
        </div>
      </div>
    </div>
  </header>

  <main class="student-shell__content"><router-outlet></router-outlet></main>

  <nav class="student-mobile-nav" aria-label="التنقل على الهاتف">
    <a routerLink="/student/dashboard" routerLinkActive="active">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">home</span
      ><span>المسار</span>
    </a>
    <a routerLink="/student/curriculum" routerLinkActive="active">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">auto_stories</span
      ><span>المنهج</span>
    </a>
    <a routerLink="/student/recordings" routerLinkActive="active">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">mic</span
      ><span>التسجيلات</span>
    </a>
    <a routerLink="/student/knowledge-bank" routerLinkActive="active">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">menu_book</span
      ><span>البنك</span>
    </a>
    <a routerLink="/student/progress" routerLinkActive="active">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">monitoring</span
      ><span>تقدمي</span>
    </a>
  </nav>
</div>
