<main dir="rtl" class="min-h-screen bg-[#F8FAFC] text-[#111827]">
  <aside class="fixed inset-y-0 right-0 z-40 hidden w-[270px] border-l border-[#E2E8F0] bg-white px-4 py-5 lg:flex lg:flex-col">
    <div class="mb-8 flex items-center gap-3 px-2">
      <div class="grid h-12 w-12 place-items-center rounded-2xl bg-[#17B3A6] text-lg font-black text-white shadow-[0_12px_28px_rgba(23,179,166,0.24)]">
        T
      </div>

      <div class="min-w-0">
        <strong class="block truncate text-base font-black">Teacher Studio</strong>
        <span class="text-xs font-bold text-[#64748B]">English Shadowing</span>
      </div>
    </div>

    <nav class="grid gap-2">
      <a routerLink="/teacher/dashboard" routerLinkActive="bg-[#E6F6F4] text-[#0F766E]" [routerLinkActiveOptions]="{ exact: true }" class="flex h-12 items-center gap-3 rounded-2xl px-4 text-sm font-black text-[#64748B] no-underline transition hover:bg-[#F1FBFA] hover:text-[#0F766E]">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">home</span>
        <span>الرئيسية</span>
      </a>

      <a routerLink="/teacher/recordings" routerLinkActive="bg-[#E6F6F4] text-[#0F766E]" [routerLinkActiveOptions]="{ exact: true }" class="flex h-12 items-center gap-3 rounded-2xl px-4 text-sm font-black text-[#64748B] no-underline transition hover:bg-[#F1FBFA] hover:text-[#0F766E]">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">mic</span>
        <span>التسجيلات</span>
      </a>

      <a routerLink="/teacher/feedback" routerLinkActive="bg-[#E6F6F4] text-[#0F766E]" class="flex h-12 items-center gap-3 rounded-2xl px-4 text-sm font-black text-[#64748B] no-underline transition hover:bg-[#F1FBFA] hover:text-[#0F766E]">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">rate_review</span>
        <span>التقييمات</span>
      </a>

      <a routerLink="/teacher/messages" routerLinkActive="bg-[#E6F6F4] text-[#0F766E]" class="flex h-12 items-center gap-3 rounded-2xl px-4 text-sm font-black text-[#64748B] no-underline transition hover:bg-[#F1FBFA] hover:text-[#0F766E]">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">mail</span>
        <span>الرسائل</span>
      </a>

      <a routerLink="/teacher/students" routerLinkActive="bg-[#E6F6F4] text-[#0F766E]" class="flex h-12 items-center gap-3 rounded-2xl px-4 text-sm font-black text-[#64748B] no-underline transition hover:bg-[#F1FBFA] hover:text-[#0F766E]">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">school</span>
        <span>الطلاب</span>
      </a>

      <a routerLink="/teacher/progress" routerLinkActive="bg-[#E6F6F4] text-[#0F766E]" class="flex h-12 items-center gap-3 rounded-2xl px-4 text-sm font-black text-[#64748B] no-underline transition hover:bg-[#F1FBFA] hover:text-[#0F766E]">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">monitoring</span>
        <span>متابعة التقدم</span>
      </a>
    </nav>

    <div class="mt-auto rounded-[22px] border border-[#E2E8F0] bg-[#F8FAFC] p-4" >
      <strong class="block truncate text-sm font-black">حساب المدرس</strong>
      <span class="mt-1 block truncate text-xs font-bold text-[#64748B]">Teacher Studio</span>

      <a routerLink="/logout" class="mt-4 flex h-10 w-full items-center justify-center gap-2 rounded-xl border border-[#E2E8F0] bg-white text-sm font-black text-[#64748B] transition hover:border-[#FCA5A5] hover:text-[#DC2626]">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">logout</span>
        <span>تسجيل الخروج</span>
      </a>
    </div>
  </aside>

  <section class="min-h-screen pb-24 lg:mr-[270px] lg:pb-0">
    <router-outlet></router-outlet>
  </section>

  <nav class="fixed inset-x-2 bottom-2 z-50 grid grid-cols-6 rounded-[22px] border border-[#E2E8F0] bg-white/95 p-1.5 shadow-[0_18px_50px_rgba(15,23,42,0.16)] backdrop-blur lg:hidden">
    <a routerLink="/teacher/dashboard" routerLinkActive="bg-[#E6F6F4] text-[#0F766E]" [routerLinkActiveOptions]="{ exact: true }" class="flex min-h-14 flex-col items-center justify-center gap-1 rounded-2xl text-[10px] font-black text-[#64748B] no-underline">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">home</span><span>الرئيسية</span>
    </a>
    <a routerLink="/teacher/recordings" routerLinkActive="bg-[#E6F6F4] text-[#0F766E]" [routerLinkActiveOptions]="{ exact: true }" class="flex min-h-14 flex-col items-center justify-center gap-1 rounded-2xl text-[10px] font-black text-[#64748B] no-underline">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">mic</span><span>التسجيلات</span>
    </a>
    <a routerLink="/teacher/feedback" routerLinkActive="bg-[#E6F6F4] text-[#0F766E]" class="flex min-h-14 flex-col items-center justify-center gap-1 rounded-2xl text-[10px] font-black text-[#64748B] no-underline">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">rate_review</span><span>التقييمات</span>
    </a>
    <a routerLink="/teacher/messages" routerLinkActive="bg-[#E6F6F4] text-[#0F766E]" class="flex min-h-14 flex-col items-center justify-center gap-1 rounded-2xl text-[10px] font-black text-[#64748B] no-underline">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">mail</span><span>الرسائل</span>
    </a>
    <a routerLink="/teacher/students" routerLinkActive="bg-[#E6F6F4] text-[#0F766E]" class="flex min-h-14 flex-col items-center justify-center gap-1 rounded-2xl text-[10px] font-black text-[#64748B] no-underline">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">school</span><span>الطلاب</span>
    </a>
    <a routerLink="/teacher/progress" routerLinkActive="bg-[#E6F6F4] text-[#0F766E]" class="flex min-h-14 flex-col items-center justify-center gap-1 rounded-2xl text-[10px] font-black text-[#64748B] no-underline">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">monitoring</span><span>المتابعة</span>
    </a>
  </nav>
</main>
